<sc-if value="{{ showChat }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:118px;top:14px;right:14px;bottom:50px;background:#e8e2cf;border:3px solid;border-color:#fff #3a3626 #3a3626 #fff;display:flex;flex-direction:column;box-shadow:6px 6px 0 #0006">
<div style="background:linear-gradient(90deg,#1d3a8a,#4a6fd8);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font-family:'Silkscreen',monospace;font-size:14px"><span>CHAT NEXORA</span><span onClick="{{ closeApp }}" style="cursor:pointer;background:#e8e2cf;color:#1b1b2a;padding:0 8px;border:2px solid;border-color:#fff #6b6552 #6b6552 #fff">X</span></div>
<sc-if value="{{ noChat }}" hint-placeholder-val="{{ false }}"><div style="padding:30px;font-size:24px;color:#3a3626">Nenhuma conversa nova.</div></sc-if>
<sc-if value="{{ hasChat }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;display:flex;flex-direction:column;min-height:0;background:#fffdf5">
<div style="padding:8px 16px;border-bottom:2px solid #cfc7ae;font-size:24px;display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;background:{{ chat.c }};border:2px solid #1b1b2a;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;font-size:14px">{{ chat.i }}</div>{{ chat.name }}</div>
<div style="flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ chatMsgs }}" as="b" hint-placeholder-count="3">
<div style="max-width:70%;align-self:{{ b.side }};background:{{ b.bg }};border:2px solid #3a3626;padding:6px 12px;font-size:22px;line-height:1.1">{{ b.t }}</div>
</sc-for>
</div>
<sc-if value="{{ chatCan }}" hint-placeholder-val="{{ false }}">
<div style="padding:10px 16px;border-top:2px solid #cfc7ae;background:#e8e2cf;display:flex;flex-direction:column;gap:8px">
<sc-for list="{{ chatChoices }}" as="c" hint-placeholder-count="3">
<div onClick="{{ c.go }}" style="font-size:20px;padding:6px 12px;background:#f6f2e4;border:2px solid;border-color:#fff #6b6552 #6b6552 #fff;cursor:pointer" style-active="border-color:#6b6552 #fff #fff #6b6552">{{ c.t }}</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-if>
</div>
</sc-if>
