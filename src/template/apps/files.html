<sc-if value="{{ showFiles }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:118px;top:14px;right:14px;bottom:50px;background:#e8e2cf;border:3px solid;border-color:#fff #3a3626 #3a3626 #fff;display:flex;flex-direction:column;box-shadow:6px 6px 0 #0006">
<div style="background:linear-gradient(90deg,#1d3a8a,#4a6fd8);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:3px 8px;font-family:'Silkscreen',monospace;font-size:14px"><span>ARQUIVOS - C:\Downloads</span><span onClick="{{ closeApp }}" style="cursor:pointer;background:#e8e2cf;color:#1b1b2a;padding:0 8px;border:2px solid;border-color:#fff #6b6552 #6b6552 #fff">X</span></div>
<sc-if value="{{ filesIdle }}" hint-placeholder-val="{{ false }}"><div style="padding:30px;font-size:24px;color:#3a3626">{{ filesIdleMsg }}</div></sc-if>
<sc-if value="{{ filesActive }}" hint-placeholder-val="{{ true }}">
<div style="flex:1;display:flex;min-height:0">
<div style="flex:1;overflow:auto;background:#fffdf5;padding:8px;display:flex;flex-direction:column;gap:6px">
<sc-for list="{{ files }}" as="f" hint-placeholder-count="5">
<div onClick="{{ f.pick }}" style="display:flex;align-items:center;gap:12px;padding:6px 10px;border:2px solid {{ f.bd }};background:{{ f.bg }};cursor:pointer;opacity:{{ f.op }}">
<div style="width:34px;height:40px;background:#fff;border:2px solid #3a3626;font-family:'Silkscreen',monospace;font-size:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px">{{ f.ext }}</div>
<div style="flex:1;font-size:23px">{{ f.n }}</div>
<div style="font-size:19px;color:#6b6552">{{ f.kb }}</div>
<div style="font-size:17px;min-width:96px;text-align:right;font-weight:bold">{{ f.status }}</div>
</div>
</sc-for>
</div>
<div style="width:300px;border-left:3px solid #6b6552;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#e8e2cf;font-size:20px;line-height:1.1">
<sc-if value="{{ hasFile }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-family:'Silkscreen',monospace;font-size:12px">DETALHES</div>
<div style="font-size:23px;word-break:break-all">{{ sf.n }}</div>
<div>Tipo: <b>{{ sf.type }}</b></div>
<div>Origem: <b>{{ sf.orig }}</b></div>
<sc-if value="{{ fileOpen }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
<div onClick="{{ fMove }}" style="padding:7px 10px;background:#bfe3c4;border:2px solid;border-color:#fff #2c6a37 #2c6a37 #fff;cursor:pointer;text-align:center" style-active="border-color:#2c6a37 #fff #fff #2c6a37">Mover para Documentos</div>
<div onClick="{{ fQuar }}" style="padding:7px 10px;background:#f2a9a2;border:2px solid;border-color:#fff #8c2a22 #8c2a22 #fff;cursor:pointer;text-align:center" style-active="border-color:#8c2a22 #fff #fff #8c2a22">Enviar para Quarentena</div>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ noFile }}" hint-placeholder-val="{{ true }}"><div style="color:#6b6552">Clique em um arquivo para ver os detalhes.</div></sc-if>
<sc-if value="{{ hasFmsg }}" hint-placeholder-val="{{ false }}"><div style="margin-top:auto;padding:8px 10px;background:{{ fmsgBg }};border:2px solid #3a3626">{{ fmsg }}</div></sc-if>
</div>
</div>
</sc-if>
</div>
</sc-if>
