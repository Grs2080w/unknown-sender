<div style="width:200px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:6px">
<div style="font-family:'Silkscreen',monospace;font-size:12px;color:#c9bf9f;letter-spacing:2px">RAMAL 204</div>
<div style="width:190px;padding:14px 12px 16px;box-sizing:border-box;background:#d8d0b8;border-radius:14px 14px 20px 20px;box-shadow:inset 0 0 0 3px #efe8d2,inset 0 -6px 0 #b9b095,0 10px 24px #000a;display:flex;flex-direction:column;align-items:center;gap:12px">
{{ phoneHandset }}
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="12"><div style="height:24px;background:#f4efdc;border:2px solid;border-color:#fff #8a8168 #8a8168 #fff;display:flex;align-items:center;justify-content:center;font-size:18px">{{ k.k }}</div></sc-for>
</div>
<div style="display:flex;align-items:center;gap:8px;font-size:17px;color:#3a3626"><div style="width:12px;height:12px;border-radius:50%;background:{{ ledColor }}"></div>{{ phoneLabel }}</div>
</div>
</div>
