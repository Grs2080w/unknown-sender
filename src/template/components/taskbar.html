<div style="position:absolute;left:0;right:0;bottom:0;height:36px;background:#cfc7ae;border-top:3px solid #fff;display:flex;align-items:center;gap:14px;padding:0 10px;box-sizing:border-box;font-size:21px">
<div style="font-family:'Silkscreen',monospace;font-size:13px;padding:3px 10px;background:#e8e2cf;border:2px solid;border-color:#fff #6b6552 #6b6552 #fff">NEXORA OS</div>
<div onClick="{{ toMenu }}" style="font-family:'Silkscreen',monospace;font-size:13px;padding:3px 10px;background:#f2a9a2;border:2px solid;border-color:#fff #8c2a22 #8c2a22 #fff;cursor:pointer" style-active="border-color:#8c2a22 #fff #fff #8c2a22">MENU</div>
<div style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ hint }}</div>
<div style="display:flex;gap:4px;align-items:center"><span style="font-size:18px;margin-right:4px">Escudos</span>
<sc-for list="{{ shields }}" as="sh" hint-placeholder-count="3"><div style="width:16px;height:20px;background:{{ sh.c }};border:2px solid #1b1b2a;border-radius:2px 2px 8px 8px"></div></sc-for></div>
<div>Pontos: <b>{{ score }}</b></div>
<div style="padding:2px 10px;border:2px solid;border-color:#6b6552 #fff #fff #6b6552;background:#e8e2cf">{{ clock }}</div>
</div>
