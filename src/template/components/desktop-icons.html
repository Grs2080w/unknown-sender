<div style="position:absolute;left:16px;top:16px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{ icons }}" as="ic" hint-placeholder-count="3">
<div onClick="{{ ic.go }}" style="width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative">
<div style="width:56px;height:56px;background:{{ ic.bg }};border:3px solid;border-color:#fff #3a3626 #3a3626 #fff;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;font-size:26px;font-weight:700;color:#1b1b2a">{{ ic.glyph }}</div>
<div style="color:#fff;font-size:20px;text-shadow:1px 1px 0 #0b2523">{{ ic.label }}</div>
<sc-if value="{{ ic.badge }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;top:-6px;right:6px;width:22px;height:22px;border-radius:50%;background:#e04a3f;border:2px solid #fff;color:#fff;font-size:16px;line-height:19px;text-align:center;animation:pop .4s">!</div></sc-if>
</div>
</sc-for>
</div>
