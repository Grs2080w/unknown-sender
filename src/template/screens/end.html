<sc-if value="{{ screenEnd }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#0b1f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;text-align:center;padding:0 60px">
<div style="font-family:'Silkscreen',monospace;color:#7fd8c8;font-size:15px;letter-spacing:3px">{{ endKicker }}</div>
<div style="font-family:'Silkscreen',monospace;font-weight:700;color:{{ endColor }};font-size:42px;line-height:1">{{ endTitle }}</div>
<div style="color:#fff;font-size:26px">Pontos: <b>{{ score }}</b> &nbsp;|&nbsp; Escudos restantes: <b>{{ lives }}</b></div>
<div style="background:#12302e;border:2px solid #2f6b66;padding:12px 22px;text-align:left;color:#d6f3ec;font-size:23px;line-height:1.1;max-width:700px">
<div style="font-family:'Silkscreen',monospace;font-size:13px;color:#ffb000;margin-bottom:6px">O QUE LEVAR DESTE DIA</div>
<sc-for list="{{ lessons }}" as="l" hint-placeholder-count="4"><div style="margin-bottom:4px">&#9658; {{ l.t }}</div></sc-for>
</div>
<div onClick="{{ start }}" style="margin-top:6px;font-family:'Silkscreen',monospace;font-size:18px;padding:10px 24px;background:#ffb000;color:#1b1b2a;border:3px solid;border-color:#ffe08a #7a4a00 #7a4a00 #ffe08a;cursor:pointer" style-hover="background:#ffc933">JOGAR DE NOVO</div>
</div>
</sc-if>
