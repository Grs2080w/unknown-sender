<sc-if value="{{ screenQEnd }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#0b1f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20;text-align:center;padding:0 60px">
<div style="font-family:'Silkscreen',monospace;color:#7fd8c8;font-size:15px;letter-spacing:3px">QUIZ FINALIZADO</div>
<div style="font-family:'Silkscreen',monospace;font-weight:700;color:{{ qEndColor }};font-size:40px;line-height:1">{{ qEndTitle }}</div>
<div style="color:#fff;font-size:26px">Acertos: <b>{{ qCorrect }}/{{ qTotal }}</b> &nbsp;|&nbsp; Pontos: <b>{{ qScore }}</b></div>
<div style="background:#12302e;border:2px solid #2f6b66;padding:12px 22px;text-align:left;color:#d6f3ec;font-size:23px;line-height:1.1;min-width:420px">
<div style="font-family:'Silkscreen',monospace;font-size:13px;color:#ffb000;margin-bottom:6px">ACERTOS POR TEMA</div>
<sc-for list="{{ qCats }}" as="c" hint-placeholder-count="5"><div style="display:flex;justify-content:space-between;gap:30px;margin-bottom:3px"><span>{{ c.n }}</span><b style="color:{{ c.col }}">{{ c.r }}</b></div></sc-for>
</div>
<div style="display:flex;gap:16px;margin-top:6px">
<div onClick="{{ startQuiz }}" style="font-family:'Silkscreen',monospace;font-size:16px;padding:10px 22px;background:#ffb000;color:#1b1b2a;border:3px solid;border-color:#ffe08a #7a4a00 #7a4a00 #ffe08a;cursor:pointer" style-hover="background:#ffc933">REFAZER QUIZ</div>
<div onClick="{{ toMenu }}" style="font-family:'Silkscreen',monospace;font-size:16px;padding:10px 22px;background:#7fd8c8;color:#1b1b2a;border:3px solid;border-color:#d4f5ee #1f6f6b #1f6f6b #d4f5ee;cursor:pointer" style-hover="background:#a2e8db">MENU</div>
</div>
</div>
</sc-if>
