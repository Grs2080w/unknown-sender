<sc-if value="{{ screenTitle }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0;background:#0b1f1e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;text-align:center">
<div style="font-family:'Silkscreen',monospace;color:#7fd8c8;font-size:15px;letter-spacing:3px">NEXORA LTDA. - PRIMEIRO DIA</div>
<div style="font-family:'Silkscreen',monospace;font-weight:700;color:#ffb000;font-size:62px;line-height:.95;text-shadow:4px 4px 0 #7a4a00">REMETENTE<br>DESCONHECIDO</div>
<div style="color:#bfe9df;font-size:25px;max-width:560px;line-height:1.1">Emails, ligacoes, mensagens e arquivos. Qualquer tarefa pode esconder um golpe.</div>
<div style="display:flex;gap:20px;margin-top:8px">
<div onClick="{{ start }}" style="width:300px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-size:18px;padding:14px 18px;background:#ffb000;color:#1b1b2a;border:3px solid;border-color:#ffe08a #7a4a00 #7a4a00 #ffe08a;cursor:pointer;line-height:1.2" style-hover="background:#ffc933" style-active="border-color:#7a4a00 #ffe08a #ffe08a #7a4a00">MODO INTERATIVO<div style="font-family:'VT323',monospace;font-size:21px;margin-top:4px">Viva um dia de trabalho</div></div>
<div onClick="{{ startQuiz }}" style="width:300px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-size:18px;padding:14px 18px;background:#7fd8c8;color:#1b1b2a;border:3px solid;border-color:#d4f5ee #1f6f6b #1f6f6b #d4f5ee;cursor:pointer;line-height:1.2" style-hover="background:#a2e8db" style-active="border-color:#1f6f6b #d4f5ee #d4f5ee #1f6f6b">MODO QUIZ<div style="font-family:'VT323',monospace;font-size:21px;margin-top:4px">12 perguntas com a Marta</div></div>
</div>
</div>
</sc-if>
