<sc-if value="{{ screenQuiz }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;background:#1f6f6b;z-index:20">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px)"></div>
<div style="position:absolute;left:0;right:0;top:0;height:44px;background:#cfc7ae;border-bottom:3px solid #3a3626;display:flex;align-items:center;gap:14px;padding:0 12px;box-sizing:border-box;font-size:22px">
<div onClick="{{ toMenu }}" style="font-family:'Silkscreen',monospace;font-size:12px;padding:4px 10px;background:#e8e2cf;border:2px solid;border-color:#fff #6b6552 #6b6552 #fff;cursor:pointer">MENU</div>
<div style="font-family:'Silkscreen',monospace;font-size:13px">QUIZ {{ qNum }}/{{ qTotal }}</div>
<div style="flex:1;height:14px;background:#e8e2cf;border:2px solid #3a3626"><div style="height:100%;width:{{ qPct }};background:#3fae5a"></div></div>
<div style="background:#ffd34d;border:2px solid #1b1b2a;padding:0 10px;font-size:20px">{{ qCat }}</div>
<div>Pontos: <b>{{ qScore }}</b></div>
</div>
<div style="position:absolute;left:20px;right:20px;top:60px;display:flex;gap:20px;align-items:flex-start">
<sc-if value="{{ hasScn }}" hint-placeholder-val="{{ false }}">
<div style="width:330px;flex:none;background:#fffdf5;border:3px solid;border-color:#fff #3a3626 #3a3626 #fff;box-shadow:5px 5px 0 #0006">
<div style="background:linear-gradient(90deg,#1d3a8a,#4a6fd8);color:#fff;font-family:'Silkscreen',monospace;font-size:13px;padding:3px 8px">{{ scn.kind }}</div>
<div style="padding:10px 14px;font-size:21px;line-height:1.1">
<div style="color:#6b6552">De: <b style="color:#1b1b2a;word-break:break-all">{{ scn.from }}</b></div>
<sc-if value="{{ scn.hasSubj }}" hint-placeholder-val="{{ false }}"><div style="margin-top:2px;font-size:23px;word-break:break-all"><b>{{ scn.subject }}</b></div></sc-if>
<div style="margin-top:8px;border-top:2px dashed #cfc7ae;padding-top:8px">
<sc-for list="{{ scn.lines }}" as="ln" hint-placeholder-count="2"><div style="margin-bottom:6px;word-break:break-word">{{ ln.t }}</div></sc-for>
</div>
</div>
</div>
</sc-if>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">
<div style="background:#f4efdc;border:3px solid #1b1b2a;box-shadow:5px 5px 0 #0007;padding:10px 16px;font-size:27px;line-height:1.05">{{ qPrompt }}</div>
<sc-for list="{{ qOpts }}" as="o" hint-placeholder-count="4">
<div onClick="{{ o.go }}" style="display:flex;gap:12px;align-items:center;font-size:22px;line-height:1.05;padding:7px 12px;background:{{ o.bg }};border:2px solid #1b1b2a;cursor:pointer;opacity:{{ o.op }}" style-hover="outline:3px solid #ffd34d">
<div style="flex:none;width:28px;height:28px;background:#1b1b2a;color:#ffd34d;font-family:'Silkscreen',monospace;font-size:14px;display:flex;align-items:center;justify-content:center">{{ o.l }}</div><div>{{ o.t }}</div>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{ qAnswered }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:12px;align-items:flex-end">
<div style="width:96px;height:118px;flex:none;background:#4fc3b8;border:3px solid #1b1b2a;display:flex;align-items:center;justify-content:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:48px;box-shadow:5px 5px 0 #0007">M</div>
<div style="flex:1;position:relative;background:#f4efdc;border:3px solid #1b1b2a;box-shadow:5px 5px 0 #0007;padding:20px 18px 12px;box-sizing:border-box">
<div style="position:absolute;top:-17px;left:14px;background:{{ qFbColor }};border:3px solid #1b1b2a;padding:0 12px;font-family:'Silkscreen',monospace;font-size:14px;line-height:26px">{{ qFbTitle }}</div>
<div style="font-size:23px;line-height:1.05;padding-right:150px">{{ qExplain }}</div>
<div onClick="{{ qNext }}" style="position:absolute;right:14px;bottom:12px;font-family:'Silkscreen',monospace;font-size:13px;padding:8px 14px;background:#ffb000;border:3px solid;border-color:#ffe08a #7a4a00 #7a4a00 #ffe08a;cursor:pointer" style-hover="background:#ffc933">{{ qNextLabel }}</div>
</div>
</div>
</sc-if>
</div>
</sc-if>
